# Virtual DJ - Docker Compose stack (single container, Icecast bundled)
#
# Usage:
#   1. Copy .env.example to .env and edit (at least set MUSIC_DIR on the host).
#   2. docker compose up -d --build
#   3. Open http://localhost:8420  (web UI) and http://localhost:8008/virtualdj
#      (the Icecast mount for Winamp / VLC / Sonos).
#
# What is persistent: everything the app writes lives in the `data` named
# volume (config.json, vdj.sqlite3, downloaded voice models, DJ cache). The
# music library is mounted READ-ONLY from the host (the DJ never writes to it).
#
# Icecast: the app runs a *managed* Icecast2 server in the same container
# (rendered from data/config.json). The app image runs as root so icecast2 -b
# can perform its privilege-drop (required for MP3 source mounts to serve).
# Because of that, this single-container deployment intentionally does NOT use
# the read-only-rootfs / cap_drop hardening the old split stack had -- the
# trade-off for having one image that fully controls Icecast.

services:
  virtual-dj:
    build: .
    image: virtual-dj:latest
    container_name: virtual-dj
    # Auto-download the default Piper voices on first run. Set to "1" to skip
    # (e.g. if you pre-populate /data/voices or have no outbound network).
    environment:
      VDJ_NO_VOICE_DOWNLOAD: "${VDJ_NO_VOICE_DOWNLOAD:-0}"
      VDJ_HOST: "0.0.0.0"
      VDJ_PORT: "8420"
      VDJ_LOG_LEVEL: "${VDJ_LOG_LEVEL:-info}"
      # Icecast is managed by the app (bundled). These tell the app's pusher +
      # server where to listen/render. The web UI can override both of these at
      # runtime; a saved value in data/config.json wins. The published host port
      # below MUST match ICECAST_PORT so external players reach Icecast.
      VDJ_ICECAST_ENABLED: "${VDJ_ICECAST_ENABLED:-1}"
      VDJ_ICECAST_HOST: "127.0.0.1"
      VDJ_ICECAST_PORT: "${ICECAST_PORT:-8008}"
      VDJ_ICECAST_MOUNT: "${ICECAST_MOUNT:-virtualdj}"
      VDJ_ICECAST_SOURCE_PASSWORD: "${ICECAST_SOURCE_PASSWORD:-hackme}"
      VDJ_ICECAST_PUBLIC_PORT: "${ICECAST_PORT:-8008}"
      VDJ_ICECAST_PUBLIC_HOST: "${ICECAST_PUBLIC_HOST:-}"
      # Optional: point the DJ at an Ollama instance. Uncomment (and set in
      # .env) to reach Ollama on the Docker host. Inside the container,
      # "host-gateway" resolves to the host's loopback. The web UI can override
      # both of these at runtime; a saved value in data/config.json wins.
      VDJ_OLLAMA_URL: "${VDJ_OLLAMA_URL:-}"
      VDJ_OLLAMA_MODEL: "${VDJ_OLLAMA_MODEL:-}"
    ports:
      # Web UI / app API.
      - "${HTTP_PORT:-8420}:8420"
      # Icecast mount for external players (Winamp / VLC / Sonos). BOTH sides of
      # the mapping use ICECAST_PORT so the host port the players hit equals the
      # port Icecast actually listens on inside the container. Change ICECAST_PORT
      # in .env to move off 8008 (e.g. to avoid a conflict) and it updates the
      # listen port AND the published port together.
      - "${ICECAST_PORT:-8008}:${ICECAST_PORT:-8008}"
    volumes:
      # Persistent app state (config, DB, voices, cache).
      - virtual-dj-data:/data
      # Your music library, read-only. Set MUSIC_DIR in .env to a real path.
      - "${MUSIC_DIR:-/mnt/mp3}:/music:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8420/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  virtual-dj-data:
    driver: local
